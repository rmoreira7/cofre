name: watch
on:
  schedule:
    - cron: "0 11 * * *" # 08:00 BRT, after Pluggy's evening sync of each bank
  workflow_dispatch:
    inputs:
      digest:
        description: "Send the weekly digest today"
        type: boolean
        default: false
permissions:
  contents: read
concurrency: { group: watch, cancel-in-progress: false }
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: node watch/run.mjs
        env:
          PLUGGY_CLIENT_ID: ${{ secrets.PLUGGY_CLIENT_ID }}
          PLUGGY_CLIENT_SECRET: ${{ secrets.PLUGGY_CLIENT_SECRET }}
          PLUGGY_ITEMS: ${{ secrets.PLUGGY_ITEMS }}
          COFRE_ENTITIES: ${{ secrets.COFRE_ENTITIES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_DIGEST: ${{ inputs.digest && '1' || '' }}
